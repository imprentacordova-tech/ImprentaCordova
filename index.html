<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imprenta Córdova 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-blue': '#0B42A7',
              'brand-red': '#D90000',
              'neutral-light': '#F3F5F7',
              'neutral-dark': '#111827',
              'neutral-text': '#1F2937',

              // KPI Card Colors
              'kpi-blue-bg': '#EBF5FF',
              'kpi-green-bg': '#E6FBF0',
              'kpi-purple-bg': '#F4EFFF',
              'kpi-red-bg': '#FFEBEB',
              'kpi-gray-bg': '#F3F4F6',
              'kpi-orange-bg': '#FFFBEB',

              'kpi-blue-text-tag': '#4C82E5',
              'kpi-blue-bg-tag': '#D8E6FF',

              'kpi-green-text-tag': '#00B88A',
              'kpi-green-bg-tag': '#C2F5E9',

              'kpi-purple-text-tag': '#8A63F0',
              'kpi-purple-bg-tag': '#E5D9FF',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(-10px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              slideInUp: {
                '0%': { opacity: 0, transform: 'translateY(30px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              pulse: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.05)' },
              },
              heroZoom: {
                '0%': { transform: 'scale(1.1)' },
                '100%': { transform: 'scale(1)' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-in-up': 'slideInUp 0.7s cubic-bezier(0.250, 0.460, 0.450, 0.940) both',
              'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'hero-zoom': 'heroZoom 15s ease-out forwards',
            },
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^18.3.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.3.1/",
    "react/": "https://aistudiocdn.com/react@^18.3.1/",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^6.22.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.1.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.344.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^4.2.0",
    "vite": "https://aistudiocdn.com/vite@^5.1.0",
    "path": "https://aistudiocdn.com/path@^0.12.7"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-neutral-light dark:bg-neutral-dark text-neutral-text dark:text-neutral-light">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
