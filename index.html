
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO MAESTRO: Dominio total en Pasaje y El Oro -->
    <title>Imprenta Córdova | Excelencia Gráfica</title>
    <meta name="description" content="Imprenta Córdova: Gigantografías HD, Facturas SRI y Publicidad de alto impacto en Pasaje, El Oro. Diseño profesional y tecnología Roland." />
    <link rel="icon" type="image/png" href="/LOGO.png" />
    <link rel="apple-touch-icon" href="/LOGO.png" />
    
    <!-- FUENTES PREMIUM -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
            },
            colors: {
              'brand-blue': '#0A1E40', // Azul Medianoche profundo
              'brand-red': '#E11D48',  // Rose 600 - más vibrante y moderno
              'brand-dark': '#030712', // Obsidian - el color de lujo por excelencia
              'liquid-gold': '#D4AF37', // Oro clásico para acentos
              'surface-light': '#FDFDFD',
              'surface-dark': '#0F172A',
            },
            animation: {
              'fade-in': 'fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-up': 'slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'mesh': 'mesh 15s ease infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(40px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              mesh: {
                '0%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
                '100%': { 'background-position': '0% 50%' },
              }
            },
            boxShadow: {
              'luxury': '0 25px 50px -12px rgba(0, 0, 0, 0.5)',
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.2)',
              'gold-glow': '0 0 30px rgba(212, 175, 55, 0.15)',
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-surface-light dark:bg-brand-dark text-slate-800 dark:text-slate-200 antialiased selection:bg-brand-blue selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
