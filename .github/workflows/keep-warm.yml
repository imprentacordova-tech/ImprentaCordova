# Keep-warm — Backend SRI (Render)
# =================================
# El backend vive en el plan gratuito de Render, que duerme el servicio tras
# ~15 min sin tráfico: la primera solicitud SRI del día puede tardar 30-60s
# en responder (cold-start). Este workflow pinguea /ping cada 10 minutos
# para que el servicio no llegue a dormirse. No requiere checkout del repo.
name: Keep-warm backend SRI

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping /ping
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Pinguear el backend
        # Render puede contestar 404 por un instante mientras despierta la instancia:
        # se reintenta en vez de marcar la corrida en rojo. El panel también lo despierta
        # (services/backendApi.ts → despertarBackend), porque GitHub no garantiza la
        # frecuencia del cron (en la práctica corre cada varias horas).
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/ping.txt -w '%{http_code}' --max-time 90 https://cordova-sri-api.onrender.com/ping || echo 000)
            echo "intento $i: HTTP $code"; cat /tmp/ping.txt; echo
            [ "$code" = "200" ] && exit 0
            sleep $((i * 20))
          done
          exit 1
