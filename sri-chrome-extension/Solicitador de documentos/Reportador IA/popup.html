<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportador SRI - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c0c1ff;
            --primary-glow: rgba(192, 193, 255, 0.3);
            --secondary: #4edea3;
            --accent: #ffb95f;
            --bg: #0b1326;
            --surface: #171f33;
            --surface-bright: #2d3449;
            --text-main: #dae2fd;
            --text-muted: #908fa0;
            --error: #ffb4ab;
        }

        body {
            width: 360px;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        .app-container {
            padding: 24px;
            background: linear-gradient(180deg, rgba(192, 193, 255, 0.05) 0%, rgba(11, 19, 38, 0) 100%);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
        }
        .header img {
            width: 44px;
            height: 44px;
            margin-right: 16px;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }
        .header .title-group h1 {
            font-size: 20px;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .header .version {
            font-size: 10px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* Hero Stats */
        .hero-stats {
            background: var(--surface);
            border: 1px solid rgba(192, 193, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .hero-stats::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            opacity: 0.3;
            pointer-events: none;
        }
        .stats-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .stats-count {
            font-size: 56px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        /* Grid info */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .data-card {
            background: rgba(45, 52, 73, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
        }
        .data-card label {
            display: block;
            font-size: 9px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .data-card span {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Massive Action */
        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, #8083ff 100%);
            color: #0b1326;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 16px rgba(128, 131, 255, 0.2);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(128, 131, 255, 0.3);
            filter: brightness(1.1);
        }
        .btn-main:active { transform: translateY(0); }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .btn-outline {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(192, 193, 255, 0.2);
            color: var(--primary);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            background: rgba(192, 193, 255, 0.05);
            border-color: var(--primary);
        }

        /* Console */
        .console {
            background: #060e20;
            border-radius: 12px;
            padding: 12px;
            height: 100px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 11px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .console-entry {
            margin-bottom: 6px;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
        }
        .console-time { color: var(--primary); opacity: 0.6; }
        .console-msg { color: var(--text-main); }

        /* Status Dot */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(78, 222, 163, 0.1);
            color: var(--secondary);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 16px;
            width: fit-content;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--secondary);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img src="icons/icon128.png" alt="Logo">
            <div class="title-group">
                <div class="version">SRI Turbo Elite</div>
                <h1>Reportador Pro</h1>
            </div>
        </div>

        <div class="status-pill" id="statusPill">
            <div class="dot"></div>
            <span id="statusText">Sistema Listo</span>
        </div>

        <div class="data-grid" style="grid-template-columns: repeat(3, 1fr);">
            <div class="data-card">
                <label>25h</label>
                <span id="labelT25">0</span>
            </div>
            <div class="data-card">
                <label>50h</label>
                <span id="labelT50">0</span>
            </div>
            <div class="data-card">
                <label>100h</label>
                <span id="labelT100">0</span>
            </div>
            <div class="data-card">
                <label>200h</label>
                <span id="labelT200">0</span>
            </div>
            <div class="data-card">
                <label>Otros</label>
                <span id="labelTOther">0</span>
            </div>
            <div class="data-card" style="border-color: var(--primary);">
                <label>TOTAL</label>
                <span id="countValue" style="color: var(--primary);">0</span>
            </div>
        </div>

        <button id="btnStart" class="btn-main">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            INICIAR REPORTE
        </button>

        <button id="btnAceptar" class="btn-main" style="background: linear-gradient(135deg, #4edea3 0%, #2ecc71 100%); margin-top: 8px; color: #0b1326; box-shadow: 0 8px 16px rgba(46, 204, 113, 0.2);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 11 12 14 22 4"></polyline></svg>
            IR A SOLICITUDES
        </button>

        <div class="btn-group">
            <button id="btnStop" class="btn-outline">Detener</button>
            <button id="btnReset" class="btn-outline">Reiniciar</button>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
            <div style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Asistente en Pantalla</div>
            <label class="switch">
                <input type="checkbox" id="chkAssistant" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="console" id="logContainer">
            <!-- Logs go here -->
        </div>

        <div style="margin-top: 20px; text-align: center; font-size: 9px; color: var(--text-muted); letter-spacing: 1px;">
            SANTIAGO CORDOVA &copy; 2026 • v1.5 ELITE
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
